<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>企會財商業策略指揮中心｜營商環境單元總目錄（第 1 至 3 課）</title>
  <style>
    :root {
      --bg-dark: #090d1a;
      --panel-dark: #161f38;
      --card-bg: #ffffff;
      --soft-bg: #f8fafc;
      --indigo-dark: #1e1b4b;
      --indigo: #4f46e5;
      --indigo-light: #e0e7ff;
      --blue: #2563eb;
      --blue-light: #dbeafe;
      --teal: #0d9488;
      --teal-light: #ccfbf1;
      --amber: #d97706;
      --amber-bright: #fbbf24;
      --amber-light: #fef3c7;
      --emerald: #16a34a;
      --emerald-light: #dcfce7;
      --rose: #e11d48;
      --rose-light: #ffe4e6;
      --text: #0f172a;
      --muted: #64748b;
      --scale: 1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "PingFang HK", "Microsoft JhengHei", "Noto Sans TC", sans-serif; user-select: none; }
    body {
      background: radial-gradient(circle at top left, #1e3a8a 0%, #0f172a 50%, #090d1a 100%);
      color: var(--text);
      padding: 14px;
      font-size: calc(15.5px * var(--scale));
      line-height: 1.55;
      min-height: 100vh;
    }
    .app { max-width: 1140px; margin: 0 auto; }

    @keyframes popIn { 0% { transform: scale(0.96); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
    .pop { animation: popIn 0.22s ease-out; }
    .shake { animation: shake 0.3s ease-in-out; }

    /* 頂部商業策略指揮中心看板 */
    .hero-ceo {
      background: linear-gradient(135deg, #1e3a8a 0%, #3730a3 50%, #0f766e 100%);
      border-radius: 22px;
      padding: 20px 26px;
      color: #fff;
      margin-bottom: 14px;
      box-shadow: 0 14px 32px rgba(0,0,0,0.5);
      border: 1px solid rgba(147, 197, 253, 0.35);
    }
    .hc-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px; margin-bottom: 14px; }
    .hc-brand { display: flex; align-items: center; gap: 14px; }
    .ceo-badge {
      background: linear-gradient(135deg, #fbbf24, #d97706);
      color: #0f172a; padding: 10px 15px; border-radius: 14px;
      font-weight: 900; font-size: calc(12.5px * var(--scale)); letter-spacing: 0.5px;
      box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35); text-align: center; line-height: 1.25;
    }
    .hc-title { font-size: calc(22px * var(--scale)); font-weight: 900; letter-spacing: 0.5px; }
    .hc-sub { font-size: calc(13px * var(--scale)); color: #bfdbfe; font-weight: 700; margin-top: 2px; }

    .hc-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .pill-stat { background: rgba(9, 13, 26, 0.65); border: 1px solid rgba(147, 197, 253, 0.45); padding: 6px 14px; border-radius: 30px; font-weight: 900; font-size: calc(13.5px * var(--scale)); color: #93c5fd; }
    .ctrl-btn { background: var(--amber-bright); color: #0f172a; border: none; padding: 7px 14px; border-radius: 30px; font-weight: 900; font-size: calc(13px * var(--scale)); cursor: pointer; transition: transform 0.15s; }
    .ctrl-btn:hover { transform: scale(1.05); background: #fcd34d; }

    /* 進度追蹤列 */
    .prog-bar-wrap { background: rgba(9, 13, 26, 0.55); border-radius: 12px; padding: 10px 16px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; border: 1px solid rgba(255,255,255,0.15); }
    .prog-text { font-size: calc(13.5px * var(--scale)); font-weight: 900; color: #e0f2fe; white-space: nowrap; }
    .prog-track { flex: 1; min-width: 180px; height: 12px; background: rgba(255,255,255,0.15); border-radius: 20px; overflow: hidden; }
    .prog-fill { height: 100%; background: linear-gradient(90deg, #38bdf8, #fbbf24); border-radius: 20px; transition: width 0.35s ease; }
    .prog-reset { background: transparent; border: 1px solid rgba(255,255,255,0.35); color: #cbd5e1; padding: 4px 10px; border-radius: 8px; font-size: calc(12px * var(--scale)); font-weight: 800; cursor: pointer; }
    .prog-reset:hover { background: rgba(255,255,255,0.15); color: #fff; }

    /* 四大主視圖切換導航 */
    .hub-nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
    @media (max-width: 780px) { .hub-nav { grid-template-columns: repeat(2, 1fr); } }
    .hub-tab {
      background: var(--panel-dark); border: 2px solid #2e3b5e; border-radius: 14px; padding: 12px 10px;
      color: #94a3b8; cursor: pointer; text-align: center; transition: all 0.2s;
    }
    .hub-tab:hover { border-color: #60a5fa; color: #fff; transform: translateY(-2px); }
    .hub-tab.active {
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      border-color: #93c5fd; color: #fff; box-shadow: 0 6px 18px rgba(37, 99, 235, 0.45);
    }
    .hub-icon { font-size: calc(23px * var(--scale)); display: block; margin-bottom: 3px; }
    .hub-label { font-size: calc(14.5px * var(--scale)); font-weight: 900; display: block; }
    .hub-sub { font-size: calc(11.5px * var(--scale)); opacity: 0.9; }

    /* 主舞台 */
    .stage {
      background: var(--card-bg);
      border-radius: 22px;
      padding: 24px;
      min-height: 550px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.5);
      border: 2px solid #cbd5e1;
    }

    /* ================= 視圖 1：三課傳送門圖卡 ================= */
    .portal-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    @media (max-width: 920px) { .portal-grid { grid-template-columns: 1fr; } }

    .biz-card {
      background: #fff; border: 2px solid #cbd5e1; border-radius: 20px; padding: 22px;
      display: flex; flex-direction: column; justify-content: space-between;
      transition: all 0.2s; box-shadow: 0 6px 18px rgba(0,0,0,0.05); position: relative;
    }
    .biz-card:hover { transform: translateY(-4px); border-color: var(--indigo); box-shadow: 0 14px 28px rgba(79, 70, 229, 0.16); }
    .biz-card.completed { border-color: var(--emerald); background: linear-gradient(180deg, #ffffff 0%, #f0fdf4 100%); }

    .bc-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
    .bc-badge { padding: 5px 13px; border-radius: 20px; font-weight: 900; font-size: calc(13px * var(--scale)); color: #fff; display: inline-flex; align-items: center; gap: 6px; }
    .done-btn {
      padding: 5px 12px; border-radius: 20px; border: 2px solid #cbd5e1; background: #f8fafc;
      font-size: calc(12px * var(--scale)); font-weight: 900; color: var(--muted); cursor: pointer;
    }
    .done-btn.is-done { background: var(--emerald-light); border-color: var(--emerald); color: #14532d; }

    .bc-title { font-size: calc(19.5px * var(--scale)); font-weight: 900; color: var(--text); margin-bottom: 6px; }
    .bc-sub { font-size: calc(13.5px * var(--scale)); font-weight: 700; color: var(--muted); margin-bottom: 12px; }
    .bc-formula {
      background: #f8fafc; border-left: 4px solid var(--indigo); padding: 9px 12px;
      border-radius: 8px; font-size: calc(12.5px * var(--scale)); font-weight: 900; color: #1e293b; margin-bottom: 12px;
    }
    .bc-pills-wrap { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
    .bc-pill { font-size: calc(11.5px * var(--scale)); font-weight: 800; padding: 4px 9px; border-radius: 6px; background: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; }

    .bc-actions { display: flex; flex-direction: column; gap: 8px; }
    .launch-btn {
      width: 100%; padding: 12px 16px; border-radius: 12px; border: none;
      color: #fff; font-size: calc(15px * var(--scale)); font-weight: 900; cursor: pointer;
      text-align: center; text-decoration: none; display: inline-flex; justify-content: center; align-items: center; gap: 6px;
      transition: transform 0.15s;
    }
    .launch-btn:hover { transform: scale(1.01); opacity: 0.94; }
    .detail-btn {
      width: 100%; padding: 9px 14px; border-radius: 10px; border: 2px solid #cbd5e1; background: #fff;
      font-size: calc(13px * var(--scale)); font-weight: 900; color: var(--indigo-dark); cursor: pointer;
    }
    .detail-btn:hover { background: var(--indigo-light); border-color: var(--indigo); }

    /* ================= 視圖 2：互動「商業生態圈三層架構圖」 ================= */
    .eco-map-box { background: linear-gradient(135deg, #0f172a, #1e1b4b); border-radius: 18px; padding: 20px; color: #fff; margin-bottom: 18px; border: 2px solid #60a5fa; }
    .em-title { font-size: calc(16px * var(--scale)); font-weight: 900; color: #93c5fd; margin-bottom: 14px; text-align: center; }
    .em-nodes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    @media (max-width: 780px) { .em-nodes { grid-template-columns: 1fr; } }
    .em-node {
      background: rgba(255,255,255,0.06); border: 2px solid rgba(255,255,255,0.2);
      border-radius: 14px; padding: 16px 12px; text-align: center; cursor: pointer; transition: all 0.2s;
    }
    .em-node:hover { border-color: var(--amber-bright); background: rgba(255,255,255,0.14); transform: translateY(-3px); }
    .em-node.active { background: linear-gradient(145deg, #2563eb, #0d9488); border-color: #fde047; box-shadow: 0 0 18px rgba(56, 189, 248, 0.45); }
    .emn-ch { font-size: calc(12px * var(--scale)); font-weight: 900; color: #fde047; display: block; margin-bottom: 4px; }
    .emn-icon { font-size: calc(32px * var(--scale)); display: block; margin-bottom: 4px; }
    .emn-name { font-size: calc(15.5px * var(--scale)); font-weight: 900; }

    .eco-detail-card { background: #f8fafc; border: 2px solid #cbd5e1; border-radius: 16px; padding: 22px; display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 20px; align-items: center; }
    @media (max-width: 780px) { .eco-detail-card { grid-template-columns: 1fr; } }
    .ed-list { list-style: none; margin: 10px 0; }
    .ed-list li { padding: 7px 0; font-weight: 800; font-size: calc(14.5px * var(--scale)); border-bottom: 1px dashed #cbd5e1; }
    .ed-trap { background: #fff1f2; border: 2px solid #fda4af; border-radius: 12px; padding: 14px; color: #881337; font-weight: 800; font-size: calc(14px * var(--scale)); }

    /* ================= 視圖 3：跨課「三大比較速查表」工具箱 ================= */
    .tool-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .tt-btn { flex: 1; min-width: 200px; padding: 11px 12px; border-radius: 12px; border: 2px solid #cbd5e1; background: #f8fafc; font-weight: 900; font-size: calc(14px * var(--scale)); color: var(--muted); cursor: pointer; }
    .tt-btn.active { background: #1e3a8a; color: #fff; border-color: #1e3a8a; }

    .cheat-table { width: 100%; border-collapse: collapse; font-size: calc(13.5px * var(--scale)); font-weight: 800; background: #fff; border-radius: 12px; overflow: hidden; border: 2px solid #cbd5e1; }
    .cheat-table th { background: #0f172a; color: #fff; padding: 9px 12px; text-align: left; }
    .cheat-table td { padding: 8px 12px; border-bottom: 1px solid #e2e8f0; color: #0f172a; vertical-align: top; }

    /* ================= 視圖 4：跨課綜合「商業顧問」三步診斷擂台 ================= */
    .quiz-banner { background: linear-gradient(135deg, #1e3a8a, #0f172a); color: #fff; border-radius: 16px; padding: 22px; margin-bottom: 16px; border-left: 8px solid var(--amber-bright); }
    .qb-tag { font-size: calc(12.5px * var(--scale)); color: var(--amber-bright); font-weight: 900; margin-bottom: 6px; display: block; }
    .qb-stem { font-size: calc(17px * var(--scale)); font-weight: 900; line-height: 1.55; }
    .steps-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 14px; }
    @media (max-width: 820px) { .steps-grid { grid-template-columns: 1fr; } }
    .step-col { background: var(--soft-bg); border: 2px solid #cbd5e1; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; }
    .step-q { font-size: calc(13.5px * var(--scale)); font-weight: 900; color: #1e3a8a; margin-bottom: 10px; min-height: 42px; }
    .step-opts { display: flex; flex-direction: column; gap: 7px; }
    .step-btn { width: 100%; padding: 10px 12px; border-radius: 9px; border: 2px solid #cbd5e1; background: #fff; font-weight: 800; font-size: calc(13.5px * var(--scale)); color: var(--text); cursor: pointer; text-align: left; transition: all 0.15s; line-height: 1.45; }
    .step-btn:hover { border-color: var(--indigo); background: var(--indigo-light); }
    .step-btn.picked { background: var(--indigo-light); border-color: var(--indigo); color: #1e1b4b; box-shadow: inset 0 0 0 1px var(--indigo); }

    .dot-btn { width: calc(34px * var(--scale)); height: calc(34px * var(--scale)); border-radius: 10px; border: 2px solid #cbd5e1; background: #fff; font-weight: 900; font-size: calc(13.5px * var(--scale)); cursor: pointer; color: var(--muted); }
    .dot-btn.active { background: var(--indigo); color: #fff; border-color: var(--indigo); }
    .helper-btn { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--amber); background: var(--amber-light); color: #92400e; font-weight: 900; font-size: calc(12.5px * var(--scale)); cursor: pointer; }

    .feedback-pop { margin-top: 14px; padding: 16px 18px; border-radius: 14px; font-size: calc(14.5px * var(--scale)); font-weight: 700; display: none; line-height: 1.65; }
    .fb-ok { background: var(--emerald-light); border: 2px solid var(--emerald); color: #14532d; }
    .fb-err { background: var(--rose-light); border: 2px solid var(--rose); color: #881337; }
  </style>
</head>
<body>
<div class="app">
  <!-- 頂部商業策略指揮中心看板 -->
  <header class="hero-ceo">
    <div class="hc-top">
      <div class="hc-brand">
        <div class="ceo-badge">🌐 CEO STRATEGY<br>& BUSINESS HUB</div>
        <div>
          <div class="hc-title">企會財（BAFS）商業策略指揮中心｜營商環境單元總目錄</div>
          <div class="hc-sub">涵蓋必修部分《營商環境》全套 3 課（第 1 課：香港的營商環境 ➔ 第 2 課：企業的擁有權類型 ➔ 第 3 課：商業道德與社會責任）</div>
        </div>
      </div>
      <div class="hc-controls">
        <div class="pill-stat" id="doneCountBadge">🏆 完成進度：0 / 3 課</div>
        <button class="ctrl-btn" onclick="toggleZoom()" id="zoomBtn">🔍 投影大字體：關</button>
      </div>
    </div>
    <div class="prog-bar-wrap">
      <span class="prog-text" id="progPercentText">營商環境單元進度：0%</span>
      <div class="prog-track"><div class="prog-fill" id="progFillBar" style="width: 0%;"></div></div>
      <button class="prog-reset" onclick="resetProgress()">🔄 重置進度標記</button>
    </div>
  </header>

  <!-- 四大導航模式切換 -->
  <nav class="hub-nav">
    <button class="hub-tab active" onclick="switchHubView(0)" id="hTab0">
      <span class="hub-icon">🚀</span>
      <span class="hub-label">三課互動平台傳送門</span>
      <span class="hub-sub">一鍵進入第 1 至 3 課</span>
    </button>
    <button class="hub-tab" onclick="switchHubView(1)" id="hTab1">
      <span class="hub-icon">🌐</span>
      <span class="hub-label">商業生態三層架構圖</span>
      <span class="hub-sub">串連 3 課重點與考場伏位</span>
    </button>
    <button class="hub-tab" onclick="switchHubView(2)" id="hTab2">
      <span class="hub-icon">⚡</span>
      <span class="hub-label">跨課三大比較速查表</span>
      <span class="hub-sub">經貿組織、擁有權與持份者</span>
    </button>
    <button class="hub-tab" onclick="switchHubView(3)" id="hTab3">
      <span class="hub-icon">🎯</span>
      <span class="hub-label">跨課商業顧問擂台</span>
      <span class="hub-sub">全單元融會貫通實戰個案</span>
    </button>
  </nav>

  <!-- 主舞台 -->
  <main class="stage" id="hubStage"></main>
</div>

<script>
  // =========================================================================
  // 🔗 【老師專用設定區】請在此處填入《營商環境》第 1 至 3 課的網址或檔案名稱
  // =========================================================================
  const BIZ_ENV_URLS = {
    1: "be_lesson1.html", // 第 1 課：香港的營商環境
    2: "be_lesson2.html", // 第 2 課：企業的擁有權類型
    3: "be_lesson3.html"  // 第 3 課：商業道德與社會責任
  };

  // 設定點擊傳送門時是否在新分頁開啟（true = 新分頁開啟，適合嵌入 Google Sites）
  const OPEN_IN_NEW_TAB = true;

  // ==================== 三課完整資料庫 ====================
  const bizLessons = [
    {
      ch: 1,
      icon: "🌏",
      color: "linear-gradient(135deg, #2563eb, #4f46e5)",
      badgeBg: "#2563eb",
      title: "第 1 課：香港的營商環境",
      subtitle: "商業的角色、香港經濟四大特徵、《安排》(CEPA)、全球化與國際貿易組織、六大外部環境因素",
      formula: "宏觀分析：政治 ＆ 法律 ＆ 外部經濟 ＆ 社會 ＆ 文化 ＆ 科技 ＆ 自然地理（含機場港口基建）",
      features: ["⚡ 視覺對比卡", "🎮 情境快閃分類", "🧲 磁力積木砌答案", "🖍️ 紅筆捉錯挑戰", "🏆 選擇題消去擂台"],
      points: [
        "商業角色與經濟特徵：透過「出口、轉口及服務訪港旅客」為香港賺取外匯；簡單低稅制只徵利得稅、薪俸稅、物業稅（惟煙草、烈酒、甲醇及碳氫油類四類商品仍須課稅）。",
        "與內地經貿關係及國際組織：《安排》下香港原產貨物進口內地零關稅，投資「非服務業」享國民待遇（服務業享優惠待遇）；世貿組織（WTO）具條約義務並會仲裁貿易糾紛，亞太經合組織（APEC）屬自願性質不仲裁糾紛，且兩者皆不會向成員提供財政貸款支援。",
        "影響商業決策的因素分類：機場、港口及道路（基礎建設）歸類為「自然地理因素」；人口老化、教育水平與兩文三語能力屬「社會因素」；飲食口味喜好屬「文化因素」。"
      ],
      trap: "考場伏位：① 從外地「進口」貨品是支出外匯而非賺取外匯！② 內地是香港最大貿易夥伴，但香港並非內地最大貿易夥伴；《安排》亦無允許資金自由流動！③「東主自身沒有足夠資金」屬於企業內在因素，絕非外部經濟因素！"
    },
    {
      ch: 2,
      icon: "🏢",
      color: "linear-gradient(135deg, #4f46e5, #0f766e)",
      badgeBg: "#4f46e5",
      title: "第 2 課：企業的擁有權類型",
      subtitle: "獨資經營、普通合夥與有限合夥（及名義合夥人）、私人與公眾有限公司（上市公司）、特許經營、合營企業、公營及跨國公司",
      formula: "法律地位：只有「有限公司（私人／公眾）」及「公營公司」屬獨立法定個體（法人，享永久延續權）",
      features: ["⚡ 視覺對比卡", "🎮 情境快閃分類", "🧲 磁力積木砌答案", "🖍️ 紅筆捉錯挑戰", "🏆 選擇題消去擂台"],

    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

        </div>

        <div class="feedback-pop" id="crossFb"></div>

        <div style="display:flex; justify-content:space-between; margin-top:18px; padding-top:12px; border-top:2px solid #e2e8f0;">
          <button class="detail-btn" style="width:auto;" onclick="goCrossCase(${Math.max(0, curCrossIdx - 1)})" ${curCrossIdx === 0 ? 'style="visibility:hidden"' : ''}>← 上一綜合個案</button>
          <button class="launch-btn" style="width:auto; padding:10px 22px; background:linear-gradient(135deg,#2563eb,#0d9488);" onclick="goCrossCase(${(curCrossIdx + 1) % crossCases.length})">下一綜合個案 →</button>
        </div>
      </div>
    `;

    if (stepPicks[0] !== null && stepPicks[1] !== null && stepPicks[2] !== null) {
      const fb = document.getElementById("crossFb");
      fb.style.display = "block";
      const ok0 = item.opts1[stepPicks[0]].ok;
      const ok1 = item.opts2[stepPicks[1]].ok;
      const ok2 = item.opts3[stepPicks[2]].ok;

      if (ok0 && ok1 && ok2) {
        fb.className = "feedback-pop fb-ok";
        fb.innerHTML = `🏆 <strong>跨課三步策略分析全數精準命中！你已完全融會貫通《營商環境》全單元知識！</strong><br>${item.exp}`;
      } else {
        const st = document.getElementById("hubStage");
        st.classList.remove("shake");
        void st.offsetWidth;
        st.classList.add("shake");
        fb.className = "feedback-pop fb-err";
        fb.innerHTML = `⚠️ <strong>部分步驟分析有誤：</strong> 第 1 步 [${ok0 ? '✓' : '✗'}] ｜ 第 2 步 [${ok1 ? '✓' : '✗'}] ｜ 第 3 步 [${ok2 ? '✓' : '✗'}]<br>${item.exp}`;
      }
    }
  }

  function goCrossCase(idx) {
    curCrossIdx = idx;
    stepPicks = [null, null, null];
    renderCrossQuizView(document.getElementById("hubStage"));
  }

  function pickCrossStep(sIdx, oIdx) {
    stepPicks[sIdx] = oIdx;
    renderCrossQuizView(document.getElementById("hubStage"));
  }

  function autoSolveCross() {
    const item = crossCases[curCrossIdx];
    stepPicks[0] = item.opts1.findIndex(o => o.ok);
    stepPicks[1] = item.opts2.findIndex(o => o.ok);
    stepPicks[2] = item.opts3.findIndex(o => o.ok);
    renderCrossQuizView(document.getElementById("hubStage"));
  }

  // 啟動總目錄頁
  updateProgressBar();
  renderHubStage();
</script>
</body>
</html>
