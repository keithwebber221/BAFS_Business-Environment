<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>企會財視覺互動學習平台｜第 2 課：企業的擁有權類型</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --blue: #2563eb;
      --indigo: #4f46e5;
      --teal: #0d9488;
      --green: #16a34a;
      --amber: #d97706;
      --red: #e11d48;
      --scale: 1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "PingFang HK", "Microsoft JhengHei", "Noto Sans TC", sans-serif; user-select: none; }
    body { background: var(--bg); color: var(--text); padding: 12px; font-size: calc(16px * var(--scale)); line-height: 1.55; }
    .app { max-width: 1060px; margin: 0 auto; }

    @keyframes popIn { 0% { transform: scale(0.94); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
    .pop { animation: popIn 0.22s ease-out; }
    .shake { animation: shake 0.3s ease-in-out; }

    /* 頂部遊戲化狀態列 */
    .top-bar {
      background: linear-gradient(135deg, #312e81, #4f46e5, #0f766e);
      border-radius: 16px;
      padding: 14px 20px;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.35);
    }
    .brand-title { font-size: calc(19.5px * var(--scale)); font-weight: 900; display: flex; align-items: center; gap: 8px; }
    .stat-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .pill-stat { background: rgba(15,23,42,0.6); border: 1px solid rgba(255,255,255,0.25); padding: 6px 12px; border-radius: 30px; font-weight: 800; font-size: calc(13px * var(--scale)); }
    .ctrl-btn { background: #fbbf24; color: #0f172a; border: none; padding: 7px 13px; border-radius: 30px; font-weight: 900; font-size: calc(13px * var(--scale)); cursor: pointer; transition: transform 0.15s; }
    .ctrl-btn:hover { transform: scale(1.05); background: #fcd34d; }

    /* 雙軌學習難度切換器 */
    .diff-switcher {
      display: inline-flex;
      background: rgba(15, 23, 42, 0.75);
      border: 2px solid rgba(251, 191, 36, 0.65);
      border-radius: 30px;
      padding: 3px;
      gap: 4px;
    }
    .diff-btn {
      border: none;
      padding: 5px 12px;
      border-radius: 24px;
      font-weight: 900;
      font-size: calc(13px * var(--scale));
      cursor: pointer;
      background: transparent;
      color: #cbd5e1;
      transition: all 0.2s;
    }
    .diff-btn.active-basic {
      background: #10b981;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.5);
    }
    .diff-btn.active-challenge {
      background: #f59e0b;
      color: #0f172a;
      box-shadow: 0 2px 8px rgba(245, 158, 11, 0.5);
    }

    /* 啟發式導學引導卡（只在基礎導學模式顯示） */
    .scaffold-banner {
      background: linear-gradient(135deg, #ecfdf5, #d1fae5);
      border: 2px solid #34d399;
      border-left: 7px solid var(--green);
      border-radius: 14px;
      padding: 12px 16px;
      margin-bottom: 14px;
      color: #064e3b;
      font-size: calc(14.5px * var(--scale));
      font-weight: 800;
      line-height: 1.55;
      text-align: left;
    }
    .scaffold-tag {
      display: inline-block;
      background: var(--green);
      color: #fff;
      font-size: calc(12px * var(--scale));
      font-weight: 900;
      padding: 2px 9px;
      border-radius: 20px;
      margin-right: 6px;
      margin-bottom: 3px;
    }

    /* 五大互動遊戲模式導航 */
    .mode-nav { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 12px; }
    @media (max-width: 780px) { .mode-nav { grid-template-columns: repeat(2, 1fr); } }
    .mode-tab {
      background: var(--panel);
      border: 2px solid #334155;
      border-radius: 14px;
      padding: 12px 8px;
      color: #cbd5e1;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .mode-tab:hover { border-color: #60a5fa; color: #fff; transform: translateY(-2px); }
    .mode-tab.active {
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      border-color: #93c5fd;
      color: #fff;
      box-shadow: 0 6px 16px rgba(37,99,235,0.45);
    }
    .mode-icon { font-size: calc(24px * var(--scale)); display: block; margin-bottom: 4px; }
    .mode-label { font-size: calc(14px * var(--scale)); font-weight: 900; display: block; }
    .mode-sub { font-size: calc(11.5px * var(--scale)); opacity: 0.85; }

    /* 主舞台 */
    .stage {
      background: var(--card);
      border-radius: 20px;
      padding: 24px;
      min-height: 530px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* 關卡進度與切換列 */
    .level-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; border-bottom: 2px solid #f1f5f9; padding-bottom: 12px; }
    .level-title { font-size: calc(18px * var(--scale)); font-weight: 900; color: var(--indigo); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .mode-pill-indicator { font-size: calc(12px * var(--scale)); padding: 3px 10px; border-radius: 20px; font-weight: 900; }
    .mp-basic { background: #d1fae5; color: #065f46; border: 1px solid #10b981; }
    .mp-challenge { background: #fef3c7; color: #92400e; border: 1px solid #f59e0b; }

    .dots-nav { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .dot-btn {
      width: calc(36px * var(--scale)); height: calc(36px * var(--scale));
      border-radius: 10px; border: 2px solid #cbd5e1; background: #f8fafc;
      font-weight: 900; font-size: calc(14px * var(--scale)); cursor: pointer; color: var(--muted);
    }
    .dot-btn.active { background: var(--indigo); color: #fff; border-color: var(--indigo); }
    .dot-btn.done { background: #dcfce7; color: var(--green); border-color: var(--green); }

    /* ================= 模式 1：視覺對比圖卡 ================= */
    .visual-banner { text-align: center; margin-bottom: 14px; }
    .visual-topic-tag { display: inline-block; background: #e0e7ff; color: var(--indigo); padding: 4px 14px; border-radius: 20px; font-weight: 900; font-size: calc(13.5px * var(--scale)); margin-bottom: 6px; }
    .visual-main-q { font-size: calc(21px * var(--scale)); font-weight: 900; color: var(--text); }

    .vs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin: 12px 0; }
    @media (max-width: 700px) { .vs-grid { grid-template-columns: 1fr; } }
    .vs-card { border-radius: 16px; padding: 20px; position: relative; transition: transform 0.2s; }
    .vs-card:hover { transform: translateY(-3px); }
    .vs-true { background: linear-gradient(145deg, #f0fdf4, #dcfce7); border: 3px solid #4ade80; }
    .vs-false { background: linear-gradient(145deg, #fff1f2, #ffe4e6); border: 3px solid #fb7185; }
    .vs-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-weight: 900; font-size: calc(13px * var(--scale)); margin-bottom: 10px; }
    .vs-true .vs-badge { background: var(--green); color: #fff; }
    .vs-false .vs-badge { background: var(--red); color: #fff; }
    .vs-icon { font-size: calc(38px * var(--scale)); float: right; }
    .vs-headline { font-size: calc(18px * var(--scale)); font-weight: 900; margin-bottom: 8px; }
    .vs-true .vs-headline { color: #14532d; }
    .vs-false .vs-headline { color: #881337; }
    .vs-desc { font-size: calc(15px * var(--scale)); font-weight: 700; color: #334155; }

    .interactive-check-bar { background: #f8fafc; border: 2px dashed #94a3b8; border-radius: 14px; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
    .quick-quiz-q { font-size: calc(15.5px * var(--scale)); font-weight: 800; color: var(--text); }
    .quick-btn { padding: 8px 16px; border-radius: 10px; border: 2px solid #cbd5e1; background: #fff; font-weight: 900; font-size: calc(14px * var(--scale)); cursor: pointer; transition: all 0.15s; }
    .quick-btn:hover { background: #eff6ff; border-color: var(--blue); }

    /* ================= 模式 2：街機式情境快閃分類 ================= */
    .arcade-arena { text-align: center; max-width: 820px; margin: 0 auto; width: 100%; }
    .arcade-card {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color: #fff;
      border-radius: 20px;
      padding: 24px 22px;
      margin-bottom: 16px;
      box-shadow: 0 10px 25px rgba(15,23,42,0.25);
      border: 2px solid #38bdf8;
    }
    .arcade-emoji { font-size: calc(44px * var(--scale)); display: block; margin-bottom: 8px; }
    .arcade-text { font-size: calc(19.5px * var(--scale)); font-weight: 900; line-height: 1.45; }
    .arcade-highlight { color: #38bdf8; text-decoration: underline; }

    .category-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .category-grid.grid-3col { grid-template-columns: repeat(3, 1fr); gap: 12px; }
    @media (max-width: 680px) { .category-grid, .category-grid.grid-3col { grid-template-columns: 1fr; } }
    .cat-btn {
      padding: 14px 12px; border-radius: 14px; border: 2px solid #cbd5e1; background: #f8fafc;
      cursor: pointer; font-weight: 900; font-size: calc(15.5px * var(--scale)); color: var(--text);
      transition: all 0.15s; display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .cat-btn:hover { border-color: var(--blue); background: #eff6ff; transform: scale(1.02); }
    .cat-btn span.cat-emo { font-size: calc(24px * var(--scale)); }
    .cat-sub-desc { font-size: calc(12px * var(--scale)); color: var(--muted); font-weight: 800; margin-top: 2px; line-height: 1.35; }

    /* ================= 模式 3：磁力積木砌答案 ================= */
    .question-strip { background: #fffbeb; border-left: 6px solid var(--amber); padding: 14px 18px; border-radius: 12px; font-size: calc(16px * var(--scale)); font-weight: 900; color: #78350f; margin-bottom: 12px; }
    .tray-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; flex-wrap: wrap; gap: 8px; }
    .tray-box {
      background: #f1f5f9; border: 3px dashed #64748b; border-radius: 16px; padding: 14px 16px;
      min-height: 80px; margin-bottom: 14px; display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
    }
    .tray-placeholder { color: var(--muted); font-weight: 800; font-size: calc(14.5px * var(--scale)); }
    .slot-chip {
      padding: 9px 14px; border-radius: 10px; font-weight: 900; font-size: calc(14px * var(--scale));
      color: #fff; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.12); transition: transform 0.15s;
    }
    .slot-chip:hover { transform: scale(0.97); opacity: 0.9; }
    .chip-step0 { background: var(--blue); }
    .chip-step1 { background: var(--amber); }
    .chip-step2 { background: var(--teal); }

    .blocks-section-title { font-size: calc(14px * var(--scale)); font-weight: 900; color: var(--indigo); margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
    .blocks-pool { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
    .blocks-pool.pool-2col { grid-template-columns: repeat(2, 1fr); }
    @media (max-width: 720px) { .blocks-pool, .blocks-pool.pool-2col { grid-template-columns: 1fr; } }
    .mag-block {
      padding: 12px 14px; border-radius: 12px; border: 2px solid #cbd5e1; background: #fff;
      font-size: calc(14px * var(--scale)); font-weight: 800; color: var(--text); cursor: pointer;
      text-align: left; transition: all 0.15s; box-shadow: 0 3px 6px rgba(0,0,0,0.04); line-height: 1.5;
    }
    .mag-block:hover { border-color: var(--indigo); background: #eef2ff; transform: translateY(-2px); }
    .mag-block.selected { background: #dbeafe; border-color: var(--blue); box-shadow: inset 0 0 0 2px var(--blue); }
    .mag-block.selected-err { background: #ffe4e6; border-color: var(--red); box-shadow: inset 0 0 0 2px var(--red); }
    .block-tag { display: inline-block; font-size: calc(11.5px * var(--scale)); font-weight: 900; padding: 2px 8px; border-radius: 6px; margin-bottom: 4px; }

    .helper-btn { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--indigo); background: #eef2ff; color: var(--indigo); font-weight: 800; font-size: calc(13px * var(--scale)); cursor: pointer; }
    .helper-btn:hover { background: var(--indigo); color: #fff; }

    /* ================= 模式 4：紅筆捉錯挑戰 ================= */
    .paper-sheet {
      background: #fefce8; border: 2px solid #fde047; border-radius: 16px; padding: 20px;
      box-shadow: inset 0 0 15px rgba(202,138,4,0.08); margin-bottom: 16px;
    }
    .paper-instruction { font-size: calc(14px * var(--scale)); font-weight: 900; color: var(--red); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
    .sentence-chips-wrap { display: flex; flex-direction: column; gap: 10px; }
    .sentence-chip {
      padding: 14px 16px; border-radius: 12px; border: 2px solid #cbd5e1; background: #fff;
      font-size: calc(15.5px * var(--scale)); font-weight: 800; color: var(--text); cursor: pointer;
      transition: all 0.15s; display: flex; justify-content: space-between; align-items: center; gap: 10px; line-height: 1.5;
    }
    .sentence-chip:hover { border-color: var(--red); background: #fff1f2; }
    .sentence-chip.flaw-found { border-color: var(--red); background: #ffe4e6; color: #9f1239; text-decoration: line-through; }
    .sentence-chip.good-clicked { border-color: var(--green); background: #dcfce7; color: #14532d; }

    /* ================= 模式 5：互動消去法選擇題擂台 ================= */
    .elim-stmt-row {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      background: #f8fafc; border: 2px solid #cbd5e1; border-radius: 12px; padding: 12px 16px; margin-bottom: 10px; flex-wrap: wrap;
    }
    .elim-stmt-text { font-size: calc(15px * var(--scale)); font-weight: 800; flex: 1; min-width: 240px; }
    .elim-stmt-hint { display: block; font-size: calc(12.5px * var(--scale)); color: #047857; font-weight: 800; margin-top: 4px; }
    .elim-toggles { display: flex; gap: 6px; }
    .elim-btn { padding: 6px 12px; border-radius: 8px; border: 2px solid #cbd5e1; background: #fff; font-weight: 900; font-size: calc(13.5px * var(--scale)); cursor: pointer; }
    .elim-btn.t-true { background: var(--green); color: #fff; border-color: var(--green); }
    .elim-btn.t-false { background: var(--red); color: #fff; border-color: var(--red); }

    .mc-options-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 14px; }
    @media (max-width: 600px) { .mc-options-row { grid-template-columns: 1fr; } }
    .mc-card-btn {
      padding: 14px 18px; border-radius: 12px; border: 2px solid #94a3b8; background: #fff;
      font-size: calc(16px * var(--scale)); font-weight: 900; text-align: left; cursor: pointer; transition: all 0.2s;
    }
    .mc-card-btn:hover { border-color: var(--blue); background: #eff6ff; }
    .mc-card-btn.eliminated { opacity: 0.28; text-decoration: line-through; background: #e2e8f0; border-color: #cbd5e1; }

    /* 通用反饋框與底部導航 */
    .feedback-pop { margin-top: 14px; padding: 16px 18px; border-radius: 14px; font-size: calc(15px * var(--scale)); font-weight: 700; display: none; line-height: 1.6; }
    .fb-ok { background: #dcfce7; border: 2px solid var(--green); color: #14532d; }
    .fb-err { background: #ffe4e6; border: 2px solid var(--red); color: #881337; }

    .footer-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; padding-top: 12px; border-top: 2px solid #f1f5f9; }
    .nav-btn { padding: 10px 20px; border-radius: 10px; border: 2px solid #cbd5e1; background: #fff; font-weight: 900; font-size: calc(14.5px * var(--scale)); cursor: pointer; color: var(--indigo); }
    .nav-btn:hover { background: #eef2ff; border-color: var(--indigo); }
    .primary-action { background: var(--indigo); color: #fff; border-color: var(--indigo); }
    .primary-action:hover { background: var(--blue); }
  </style>
</head>
<body>
<div class="app">
  <!-- 頂部狀態與雙軌學習難度切換器（預設開啟「🔥 實戰挑戰」） -->
  <div class="top-bar">
    <div class="brand-title">🏢 第 2 課：企業的擁有權類型</div>
    <div class="stat-group">
      <div class="diff-switcher" title="切換學習模式：預設為實戰挑戰；如需思維引導與精簡選項可切換至基礎導學">
        <button class="diff-btn" id="btnBasicMode" onclick="setDifficulty(true)">🌱 基礎導學</button>
        <button class="diff-btn active-challenge" id="btnChallengeMode" onclick="setDifficulty(false)">🔥 實戰挑戰</button>
      </div>
      <div class="pill-stat" id="comboBadge">🔥 連擊：0</div>
      <div class="pill-stat" id="scoreBadge">⭐ 總分：0</div>
      <button class="ctrl-btn" onclick="reshuffleAll()" title="重新隨機打亂所有題目與選項次序">🔀 洗牌</button>
      <button class="ctrl-btn" onclick="toggleZoom()" id="zoomBtn">🔍 大字體：關</button>
    </div>
  </div>

  <!-- 五大視覺遊戲模式切換列 -->
  <div class="mode-nav">
    <button class="mode-tab active" onclick="switchMode(0)" id="mTab0">
      <span class="mode-icon">⚡</span>
      <span class="mode-label">視覺對比卡</span>
      <span class="mode-sub">30 秒破除迷思</span>
    </button>
    <button class="mode-tab" onclick="switchMode(1)" id="mTab1">
      <span class="mode-icon">🎮</span>
      <span class="mode-label">情境快閃分類</span>
      <span class="mode-sub">直觀判別企業類型</span>
    </button>
    <button class="mode-tab" onclick="switchMode(2)" id="mTab2">
      <span class="mode-icon">🧲</span>
      <span class="mode-label">磁力積木砌答案</span>
      <span class="mode-sub">3 步拼出滿分論述</span>
    </button>
    <button class="mode-tab" onclick="switchMode(3)" id="mTab3">
      <span class="mode-icon">🖍️</span>
      <span class="mode-label">紅筆捉錯挑戰</span>
      <span class="mode-sub">點擊答卷找出失分位</span>
    </button>
    <button class="mode-tab" onclick="switchMode(4)" id="mTab4">
      <span class="mode-icon">🏆</span>
      <span class="mode-label">選擇題消去擂台</span>
      <span class="mode-sub">互動劃走錯誤選項</span>
    </button>
  </div>

  <!-- 主舞台容器 -->
  <div class="stage" id="mainStage"></div>
</div>

<script>
  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // ==================== 雙軌學習難度狀態（預設為實戰挑戰模式） ====================
  let isBasicMode = false;

  function setDifficulty(basic) {
    isBasicMode = basic;
    document.getElementById("btnBasicMode").className = "diff-btn" + (basic ? " active-basic" : "");
    document.getElementById("btnChallengeMode").className = "diff-btn" + (!basic ? " active-challenge" : "");
    renderStage();
  }

  function getModeBadgeHtml() {
    return isBasicMode
      ? `<span class="mode-pill-indicator mp-basic">🌱 基礎導學模式（提供思維引導與精簡選項）</span>`
      : `<span class="mode-pill-indicator mp-challenge">🔥 實戰挑戰模式（標準考試難度）</span>`;
  }

  // ==================== 1. 視覺對比圖卡數據（啟發式提問，不直接給答案） ====================
  const vsCards = [
    {
      topic: "獨資、合夥 vs 有限公司：法律地位與稅率",
      q: "哪類企業才是「獨立法定個體（法人）」？哪類企業的利得稅率較低？",
      trueTitle: "有限公司屬獨立法人 ＋ 獨資及合夥稅率較低",

  const allComboDefs = [
    { order: 1, reqTrue: [1], reqFalse: [2, 3], text: "只有 (1)" },
    { order: 2, reqTrue: [2], reqFalse: [1, 3], text: "只有 (2)" },
    { order: 3, reqTrue: [3], reqFalse: [1, 2], text: "只有 (3)" },
    { order: 4, reqTrue: [1, 2], reqFalse: [3], text: "只有 (1) 及 (2)" },
    { order: 5, reqTrue: [1, 3], reqFalse: [2], text: "只有 (1) 及 (3)" },
    { order: 6, reqTrue: [2, 3], reqFalse: [1], text: "只有 (2) 及 (3)" },
    { order: 7, reqTrue: [1, 2, 3], reqFalse: [], text: "(1)、(2) 及 (3)" }
  ];

  function prepareDynamicMC(mcItem) {
    const shuffled = shuffle(mcItem.rawStmts);
    mcItem.stmts = shuffled.map((s, idx) => ({
      id: idx + 1,
      text: `(${idx + 1}) ${s.text}`,
      hint: s.hint,
      isTrue: s.isTrue,
      exp: s.exp
    }));
    const trueIds = mcItem.stmts.filter(s => s.isTrue).map(s => s.id);
    const correctCombo = allComboDefs.find(c =>
      c.reqTrue.length === trueIds.length && c.reqTrue.every(id => trueIds.includes(id))
    );
    const wrongPool = shuffle(allComboDefs.filter(c => c !== correctCombo)).slice(0, 3);
    const chosenCombos = [correctCombo, ...wrongPool].sort((a, b) => a.order - b.order);
    const letters = ["A", "B", "C", "D"];
    mcItem.options = chosenCombos.map((c, idx) => ({
      label: `${letters[idx]}. ${c.text}`,
      reqTrue: c.reqTrue,
      reqFalse: c.reqFalse
    }));
    mcItem.ansIdx = chosenCombos.indexOf(correctCombo);
  }

  function randomizeAllData() {
    vsCards.forEach(v => { v.quizOpts = shuffle(v.rawOpts); });
    arcadeItems = shuffle(arcadeItems);
    legoChallenges.forEach(ch => {
      ch.step0 = shuffle(ch.step0);
      ch.step1 = shuffle(ch.step1);
      ch.step2 = shuffle(ch.step2);
    });
    redPenCases.forEach(c => { c.chips = shuffle(c.chips); });
    elimMCs = shuffle(elimMCs);
    elimMCs.forEach(m => prepareDynamicMC(m));
  }

  // ==================== 狀態管理 ====================

  let subIdx = [0, 0, 0, 0, 0];

  let score = 0;

  let legoPicked = [null, null, null];
  let elimState = { 1: null, 2: null, 3: null };

  function reshuffleAll() {
    randomizeAllData();
    legoPicked = [null, null, null];
    elimState = { 1: null, 2: null, 3: null };
    renderStage();
  }

  function toggleZoom() {
    isZoom = !isZoom;
    document.documentElement.style.setProperty('--scale', isZoom ? '1.18' : '1');
    document.getElementById("zoomBtn").innerText = isZoom ? "🔍 大字體：開" : "🔍 大字體：關";
  }

  function addScore(pts, key) {
    combo++;
    if (!doneMap[key]) {
      doneMap[key] = true;
      score += pts;
    }
    updateTopBar();
  }

  function breakCombo() {
    combo = 0;
    updateTopBar();
    const st = document.getElementById("mainStage");
    st.classList.remove("shake");
    void st.offsetWidth;
    st.classList.add("shake");
  }

  function updateTopBar() {
    document.getElementById("comboBadge").innerText = `🔥 連擊：${combo}`;
    document.getElementById("scoreBadge").innerText = `⭐ 總分：${score}`;
  }

  function switchMode(m) {
    curMode = m;
    for (let i = 0; i < 5; i++) {
      document.getElementById(`mTab${i}`).className = "mode-tab" + (i === m ? " active" : "");
    }
    legoPicked = [null, null, null];
    elimState = { 1: null, 2: null, 3: null };
    renderStage();
  }

  function goSub(idx) {
    subIdx[curMode] = idx;
    legoPicked = [null, null, null];
    elimState = { 1: null, 2: null, 3: null };
    renderStage();
  }

  function nextOrSwitch(maxLen, nextModeIdx) {
    if (subIdx[curMode] < maxLen - 1) {
      goSub(subIdx[curMode] + 1);
    } else {
      switchMode(nextModeIdx);
    }
  }

  function moveSub(delta, maxLen) {
    let next = subIdx[curMode] + delta;
    if (next >= 0 && next < maxLen) goSub(next);
  }

  function buildDots(total) {
    let html = "";
    for (let i = 0; i < total; i++) {
      const k = `${curMode}_${i}`;
      const cls = (i === subIdx[curMode]) ? "dot-btn active" : (doneMap[k] ? "dot-btn done" : "dot-btn");
      html += `<button class="${cls}" onclick="goSub(${i})">${i + 1}</button>`;
    }
    return html;
  }

  function renderStage() {
    const stage = document.getElementById("mainStage");
    stage.classList.remove("pop");
    void stage.offsetWidth;
    stage.classList.add("pop");

    if (curMode === 0) renderVisualMode(stage);
    else if (curMode === 1) renderArcadeMode(stage);
    else if (curMode === 2) renderLegoMode(stage);
    else if (curMode === 3) renderRedPenMode(stage);
    else if (curMode === 4) renderElimMode(stage);
  }

  function renderVisualMode(stage) {
    const idx = subIdx[0];

    const btns = item.quizOpts.map((opt, oIdx) =>

    const scaffoldHtml = isBasicMode ? `

        ${item.guideHint}
      </div>
    ` : '';

    stage.innerHTML = `
      <div>
        <div class="level-header">
          <span class="level-title">⚡ 視覺對比圖卡 ${getModeBadgeHtml()}</span>
          <div class="dots-nav">${buildDots(vsCards.length)}</div>

            <div class="vs-desc">${item.trueDesc}</div>
          </div>
          <div class="vs-card vs-false">
            <span class="vs-icon">${item.falseIcon}</span>
            <span class="vs-badge">🔴 常犯誤區（失分陷阱）</span>
            <div class="vs-headline">${item.falseTitle}</div>
            <div class="vs-desc">${item.falseDesc}</div>
          </div>
        </div>
        ${scaffoldHtml}
        <div class="interactive-check-bar">
          <span class="quick-quiz-q">💡 ${item.quizQ}</span>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">${btns}</div>
        </div>
        <div class="feedback-pop" id="visFb"></div>
      </div>
      <div class="footer-nav">
        <button class="nav-btn" onclick="moveSub(-1, ${vsCards.length})" ${idx === 0 ? 'style="visibility:hidden"' : ''}>← 上一張圖卡</button>
        <button class="nav-btn primary-action" onclick="nextOrSwitch(${vsCards.length}, 1)">
          ${idx === vsCards.length - 1 ? '進入「情境快閃分類」 →' : '下一張圖卡 →'}
        </button>
      </div>
    `;
  }

  function checkVisualQuiz(chosenIdx) {
    const idx = subIdx[0];
    const item = vsCards[idx];
    if (item.quizOpts[chosenIdx].ok) {
      addScore(10, `0_${idx}`);
      renderVisualMode(document.getElementById("mainStage"));
      const fb = document.getElementById("visFb");
      fb.style.display = "block";
      fb.className = "feedback-pop fb-ok";
      fb.innerHTML = "🎉 <strong>一擊即中！（+10 分）</strong> 你已成功掌握這張圖卡的核心對比！";
    } else {
      breakCombo();
      const fb = document.getElementById("visFb");
      fb.style.display = "block";
      fb.className = "feedback-pop fb-err";
      fb.innerHTML = "⚠️ <strong>再看一次左方綠色卡！</strong> 小心不要跌入右方紅色卡的常見陷阱！";
    }
  }

  // ==================== 渲染模式 2：街機式情境快閃分類 ====================
  function renderArcadeMode(stage) {
    const idx = subIdx[1];
    const item = arcadeItems[idx];

    const visibleCats = isBasicMode
      ? arcadeCategoriesMeta.filter(c => item.basicPool.includes(c.key))
      : arcadeCategoriesMeta;

    const scaffoldHtml = isBasicMode ? `
      <div class="scaffold-banner">
        <span class="scaffold-tag">🌱 導學思維引導</span>
        ${item.guideHint}（已為你縮小範圍至 3 個相關類別，並附設概念特徵）
      </div>
    ` : '';

    const catBtns = visibleCats.map(catObj => {
      const icon = catObj.key.split(" ")[0];
      const name = catObj.key.split(" ")[1];
      return `
        <button class="cat-btn" onclick="checkArcade('${catObj.key}')">
          <span class="cat-emo">${icon}</span>
          <span>${name}</span>
          ${isBasicMode ? `<span class="cat-sub-desc">${catObj.desc}</span>` : ''}
        </button>
      `;
    }).join("");

    stage.innerHTML = `
      <div>
        <div class="level-header">
          <span class="level-title">🎮 情境快閃分類 ${getModeBadgeHtml()}</span>
          <div class="dots-nav">${buildDots(arcadeItems.length)}</div>
        </div>
        <div class="arcade-arena">
          ${scaffoldHtml}
          <div class="arcade-card">
            <span class="arcade-emoji">${item.emoji}</span>
            <div class="arcade-text">${item.text}</div>
          </div>
          <div class="category-grid ${isBasicMode ? 'grid-3col' : ''}">${catBtns}</div>
          <div class="feedback-pop" id="arcFb" style="text-align:left;"></div>
        </div>
      </div>
      <div class="footer-nav">
        <button class="nav-btn" onclick="moveSub(-1, ${arcadeItems.length})" ${idx === 0 ? 'style="visibility:hidden"' : ''}>← 上一情境</button>
        <button class="nav-btn primary-action" onclick="nextOrSwitch(${arcadeItems.length}, 2)">
          ${idx === arcadeItems.length - 1 ? '進入「磁力積木砌答案」 →' : '下一情境 →'}
        </button>
      </div>
    `;
  }

  function checkArcade(chosenCat) {
    const idx = subIdx[1];
    const item = arcadeItems[idx];
    const isOk = (chosenCat === item.ans);
    if (isOk) {
      addScore(15, `1_${idx}`);
      renderArcadeMode(document.getElementById("mainStage"));
      const fb = document.getElementById("arcFb");
      fb.style.display = "block";
      fb.className = "feedback-pop fb-ok";
      fb.innerHTML = `🎯 <strong>快閃分類正確：${item.ans}！（+15 分）</strong><br>${item.exp}`;
    } else {
      breakCombo();
      const fb = document.getElementById("arcFb");
      fb.style.display = "block";
      fb.className = "feedback-pop fb-err";
      fb.innerHTML = `❌ <strong>你選了「${chosenCat}」，再想一想！</strong> 留意藍字關鍵詞符合哪種企業擁有權的特徵？`;
    }
  }

  // ==================== 渲染模式 3：磁力積木砌答案 ====================
  function renderLegoMode(stage) {
    const idx = subIdx[2];
    const item = legoChallenges[idx];

    const scaffoldHtml = isBasicMode ? `
      <div class="scaffold-banner">
        <span class="scaffold-tag">🌱 導學答題思維引導</span>
        ${item.guideHint}<br>
        ✨ <strong>導學支援</strong>：每步已精簡字數並縮小至 2 個核心選項，點選後會<strong>即時回饋你所選積木是否合乎邏輯</strong>！
      </div>
    ` : '';

    let trayHtml = "";
    if (legoPicked[0] === null && legoPicked[1] === null && legoPicked[2] === null) {
      trayHtml = `<span class="tray-placeholder">👇 請依序點擊下方「🟦 概念積木」＋「🟨 情境起因積木」＋「🟩 商業結果積木」拼出滿分答案</span>`;
    } else {
      const colors = ["chip-step0", "chip-step1", "chip-step2"];
      const stepLabels = ["🟦 概念", "🟨 起因", "🟩 結果"];
      legoPicked.forEach((pk, sIdx) => {
        if (pk !== null) {
          const obj = item[`step${sIdx}`][pk];
          const txt = isBasicMode ? obj.easyText : obj.text;
          trayHtml += `<span class="slot-chip ${colors[sIdx]}" onclick="removeLego(${sIdx})" title="點擊退回此積木">${stepLabels[sIdx]}：${txt} ✖</span>`;
        }
      });
    }

    const buildPool = (stepArr, sIdx, tagLabel, tagBg, tagColor) => {
      const visibleArr = isBasicMode ? stepArr.filter(b => b.basicKeep) : stepArr;
      return visibleArr.map((blk) => {
        const origIdx = stepArr.indexOf(blk);
        const isSel = (legoPicked[sIdx] === origIdx);
        let selCls = "";
        if (isSel) {
          selCls = (isBasicMode && !blk.ok) ? "selected-err" : "selected";
        }
        const displayTxt = isBasicMode ? blk.easyText : blk.text;
        let statusTag = `${tagLabel}`;
        if (isSel) {
          statusTag += isBasicMode ? (blk.ok ? ' ✅ 邏輯正確' : ' ❌ 再想一想') : ' ✓ 已選';
        }
        return `
          <button class="mag-block ${selCls}" onclick="pickLego(${sIdx}, ${origIdx})">
            <span class="block-tag" style="background:${tagBg}; color:${tagColor};">${statusTag}</span>
            <div>${displayTxt}</div>
          </button>
        `;
      }).join("");
    };

    const getStepInlineFeedback = (sIdx) => {
      if (!isBasicMode || legoPicked[sIdx] === null) return "";
      const pickedObj = item[`step${sIdx}`][legoPicked[sIdx]];
      return pickedObj.ok
        ? `<span style="color:#16a34a; font-size:calc(12.5px * var(--scale));">✅ 此步推論正確！</span>`
        : `<span style="color:#e11d48; font-size:calc(12.5px * var(--scale));">❌ ${pickedObj.err}</span>`;
    };

    const poolGridClass = isBasicMode ? "blocks-pool pool-2col" : "blocks-pool";

    stage.innerHTML = `
      <div>
        <div class="level-header">
          <span class="level-title">🧲 ${item.title} ${getModeBadgeHtml()}</span>
          <div class="dots-nav">
            <button class="helper-btn" onclick="autoFillCorrectLego()">💡 示範滿分拼法</button>
            ${buildDots(legoChallenges.length)}
          </div>
        </div>
        ${scaffoldHtml}
        <div class="question-strip">${item.q}</div>
        <div class="tray-header">
          <span style="font-size:calc(13.5px * var(--scale)); font-weight:900; color:var(--text);">📥 你的磁力答題槽：</span>
          <button class="helper-btn" style="border-color:#64748b; color:#475569; background:#f1f5f9;" onclick="resetLegoTray()">🔄 清空並重排積木</button>
        </div>
        <div class="tray-box" id="legoTray">${trayHtml}</div>

        <div class="blocks-section-title">
          <span>1️⃣ 第一步：點選「概念標題積木」［佔 1 分］</span>
          ${getStepInlineFeedback(0)}
        </div>
        <div class="${poolGridClass}">${buildPool(item.step0, 0, "🟦 概念標題［1 分］", "#dbeafe", "#1e3a8a")}</div>

        <div class="blocks-section-title">
          <span>2️⃣ 第二步：點選「情境起因積木」［扣連個案背景］</span>
          ${getStepInlineFeedback(1)}
        </div>
        <div class="${poolGridClass}">${buildPool(item.step1, 1, "🟨 情境起因", "#fef3c7", "#92400e")}</div>

        <div class="blocks-section-title">
          <span>3️⃣ 第三步：點選「商業結果積木」［完成因果闡釋，佔 1 分］</span>
          ${getStepInlineFeedback(2)}
        </div>
        <div class="${poolGridClass}">${buildPool(item.step2, 2, "🟩 商業結果［1 分］", "#ccfbf1", "#115e59")}</div>

        <div class="feedback-pop" id="legoFb"></div>
      </div>
      <div class="footer-nav">
        <button class="nav-btn" onclick="moveSub(-1, ${legoChallenges.length})" ${idx === 0 ? 'style="visibility:hidden"' : ''}>← 上一題</button>
        <button class="nav-btn primary-action" onclick="nextOrSwitch(${legoChallenges.length}, 3)">
          ${idx === legoChallenges.length - 1 ? '進入「紅筆捉錯挑戰」 →' : '下一題 →'}
        </button>
      </div>
    `;

    if (legoPicked[0] !== null && legoPicked[1] !== null && legoPicked[2] !== null) {
      evaluateLego();
    }
  }

  function pickLego(sIdx, bIdx) {
    legoPicked[sIdx] = bIdx;
    renderLegoMode(document.getElementById("mainStage"));
  }

  function removeLego(sIdx) {
    legoPicked[sIdx] = null;
    renderLegoMode(document.getElementById("mainStage"));
  }

  function resetLegoTray() {
    const ch = legoChallenges[subIdx[2]];
    ch.step0 = shuffle(ch.step0);
    ch.step1 = shuffle(ch.step1);
    ch.step2 = shuffle(ch.step2);
    legoPicked = [null, null, null];
    renderLegoMode(document.getElementById("mainStage"));
  }

  function autoFillCorrectLego() {
    const item = legoChallenges[subIdx[2]];
    legoPicked[0] = item.step0.findIndex(b => b.ok);
    legoPicked[1] = item.step1.findIndex(b => b.ok);
    legoPicked[2] = item.step2.findIndex(b => b.ok);
    renderLegoMode(document.getElementById("mainStage"));
  }

  function evaluateLego() {
    const idx = subIdx[2];
    const item = legoChallenges[idx];
    const b0 = item.step0[legoPicked[0]];
    const b1 = item.step1[legoPicked[1]];
    const b2 = item.step2[legoPicked[2]];
    const fb = document.getElementById("legoFb");
    fb.style.display = "block";

    if (b0.ok && b1.ok && b2.ok) {
      addScore(20, `2_${idx}`);
      fb.className = "feedback-pop fb-ok";
      fb.innerHTML = `🏆 <strong>磁力積木拼合完美！穩奪 2 / 2 分滿分！（+20 分）</strong><br>✨ <strong>完整標準答案</strong>：「<strong>${b0.text}［1 分］</strong>：<strong>${b1.text}，${b2.text}［1 分］</strong>」`;
    } else {
      breakCombo();
      let errs = [];
      if (!b0.ok) errs.push(`• 🟦 <strong>概念積木有誤</strong>：${b0.err}`);
      if (!b1.ok) errs.push(`• 🟨 <strong>起因積木有誤</strong>：${b1.err}`);
      if (!b2.ok) errs.push(`• 🟩 <strong>結果積木有誤</strong>：${b2.err}`);
      fb.className = "feedback-pop fb-err";
      fb.innerHTML = `⚠️ <strong>積木組合存在失分陷阱（請直接點擊下方正確積木替換）：</strong><br>${errs.join("<br>")}`;
    }
  }

  // ==================== 渲染模式 4：紅筆捉錯挑戰 ====================
  function renderRedPenMode(stage) {
    const idx = subIdx[3];
    const item = redPenCases[idx];
    const nums = ["①", "②", "③"];

    const scaffoldHtml = isBasicMode ? `
      <div class="scaffold-banner">
        <span class="scaffold-tag">🌱 導學審題切入點</span>
        ${item.guideHint}（已為你精簡句子字數，方便檢視邏輯）
      </div>
    ` : '';

    const chipsHtml = item.chips.map((ch, cIdx) => {
      const displayTxt = isBasicMode ? ch.easyText : ch.text;
      return `
        <div class="sentence-chip" id="rpChip_${cIdx}" onclick="checkRedPen(${cIdx})">
          <span>${nums[cIdx]} ${displayTxt}</span>
          <span style="font-size:calc(13px * var(--scale)); color:var(--red); font-weight:900; white-space:nowrap;">🖍️ 點此捉錯</span>
        </div>
      `;
    }).join("");

    stage.innerHTML = `
      <div>
        <div class="level-header">
          <span class="level-title">🖍️ ${item.title} ${getModeBadgeHtml()}</span>
          <div class="dots-nav">${buildDots(redPenCases.length)}</div>
        </div>
        ${scaffoldHtml}
        <div class="question-strip">${item.q}</div>
        <div class="paper-sheet">
          <div class="paper-instruction">🖍️ 句子次序已隨機洗牌！以下答卷有其中一句藏有嚴重概念錯誤，請直接點擊該句將它揪出來：</div>
          <div class="sentence-chips-wrap">${chipsHtml}</div>
        </div>
        <div class="feedback-pop" id="rpFb"></div>
      </div>
      <div class="footer-nav">
        <button class="nav-btn" onclick="moveSub(-1, ${redPenCases.length})" ${idx === 0 ? 'style="visibility:hidden"' : ''}>← 上一份答卷</button>
        <button class="nav-btn primary-action" onclick="nextOrSwitch(${redPenCases.length}, 4)">
          ${idx === redPenCases.length - 1 ? '進入「選擇題消去擂台」 →' : '下一份答卷 →'}
        </button>
      </div>
    `;
  }

  function checkRedPen(cIdx) {
    const idx = subIdx[3];
    const item = redPenCases[idx];
    const ch = item.chips[cIdx];
    const nums = ["①", "②", "③"];
    const el = document.getElementById(`rpChip_${cIdx}`);
    const fb = document.getElementById("rpFb");
    fb.style.display = "block";

    if (ch.isFlaw) {
      el.className = "sentence-chip flaw-found";
      addScore(20, `3_${idx}`);
      fb.className = "feedback-pop fb-ok";
      fb.innerHTML = `<strong>🖍️ 紅筆精準捉錯（第 ${nums[cIdx]} 句得 0 分）！</strong><br>${item.exp}`;
    } else {
      el.className = "sentence-chip good-clicked";
      breakCombo();
      fb.className = "feedback-pop fb-err";
      fb.innerHTML = `⭕ <strong>第 ${nums[cIdx]} 句是完全正確的得分句！</strong> 請再仔細檢查其餘句子，找出真正的概念陷阱！`;
    }
  }

  // ==================== 渲染模式 5：互動消去法選擇題擂台 ====================
  function renderElimMode(stage) {
    const idx = subIdx[4];
    const item = elimMCs[idx];

    const stmtsHtml = item.stmts.map(st => {
      const curVal = elimState[st.id];
      return `
        <div class="elim-stmt-row">
          <div class="elim-stmt-text">
            ${st.text}
            ${isBasicMode ? `<span class="elim-stmt-hint">🤔 ${st.hint}</span>` : ''}
          </div>
          <div class="elim-toggles">
            <button class="elim-btn ${curVal === true ? 't-true' : ''}" onclick="toggleElim(${st.id}, true)">⭕ 正確</button>
            <button class="elim-btn ${curVal === false ? 't-false' : ''}" onclick="toggleElim(${st.id}, false)">❌ 錯誤</button>
          </div>
        </div>
      `;
    }).join("");

    const optsHtml = item.options.map((opt, oIdx) => {
      let isElim = false;
      [1, 2, 3].forEach(sId => {
        if (elimState[sId] === true && opt.reqFalse.includes(sId)) isElim = true;
        if (elimState[sId] === false && opt.reqTrue.includes(sId)) isElim = true;
      });
      return `<button class="mc-card-btn ${isElim ? 'eliminated' : ''}" onclick="checkElimMc(${oIdx})">${opt.label}</button>`;
    }).join("");

    stage.innerHTML = `
      <div>
        <div class="level-header">
          <span class="level-title">🏆 ${item.title} ${getModeBadgeHtml()}</span>
          <div class="dots-nav">${buildDots(elimMCs.length)}</div>
        </div>
        <div class="question-strip">${item.stem}</div>
        <p style="font-size:calc(14px * var(--scale)); font-weight:800; color:var(--teal); margin-bottom:8px;">
          💡 消去法步驟：請先在右方逐句標記「⭕ 正確」或「❌ 錯誤」，下方矛盾的選項便會自動劃走！
        </p>
        <div>${stmtsHtml}</div>
        <div class="mc-options-row">${optsHtml}</div>
        <div class="feedback-pop" id="elimFb"></div>
      </div>
      <div class="footer-nav">
        <button class="nav-btn" onclick="moveSub(-1, ${elimMCs.length})" ${idx === 0 ? 'style="visibility:hidden"' : ''}>← 上一題</button>
        <button class="nav-btn primary-action" onclick="moveSub(1, ${elimMCs.length})" ${idx === elimMCs.length - 1 ? 'style="visibility:hidden"' : ''}>下一題 →</button>
      </div>
    `;
  }

  function toggleElim(sId, val) {
    elimState[sId] = (elimState[sId] === val) ? null : val;
    renderElimMode(document.getElementById("mainStage"));
  }

  function checkElimMc(oIdx) {
    const idx = subIdx[4];
    const item = elimMCs[idx];
    const fb = document.getElementById("elimFb");
    fb.style.display = "block";
    if (oIdx === item.ansIdx) {
      addScore(20, `4_${idx}`);
      const breakdown = item.stmts.map(s => `• <strong>陳述 (${s.id}) ${s.isTrue ? '⭕ 正確' : '❌ 錯誤'}</strong>：${s.exp}`).join("<br>");
      fb.className = "feedback-pop fb-ok";
      fb.innerHTML = `<strong>🏆 答對了！標準答案：${item.options[item.ansIdx].label}</strong><br>${breakdown}`;
    } else {
      breakCombo();
      fb.className = "feedback-pop fb-err";
      fb.innerHTML = "❌ <strong>選項不正確！</strong> 試試先在上方逐句判斷 (1)、(2)、(3) 的對錯，利用消去法鎖定答案！";
    }
  }

  // 啟動應用程式
  randomizeAllData();
  renderStage();
</script>
</body>
</html>
